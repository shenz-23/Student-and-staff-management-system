<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Details - Student and Staff Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-box">
        <h1>Create Account</h1>

        <p>Fill Out These Fields</p>

        <form id="signupForm">

            <label for="id">ID</label>
            <input type="number" id="id" min="1" required>

            <label for="firstName">First Name</label>
            <input type="text" id="firstName" required>

            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="contact">Contact Number</label>
            <input type="tel" id="contact" required>

            <label for="password">Initial Password</label>
            <input type="password" id="password" minlength="8" required>

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" required>

            <label for="role">Account Type</label>
            <select id="role" required>
                <option value="">Select Role</option>
                <option value="student">Student</option>
                <option value="lecturer">Lecturer</option>
            </select>

            <label for="nic">NIC (optional)</label>
            <input type="text" id="nic">

            <label for="address">Address (optional)</label>
            <input type="text" id="address">

            <div id="lecturerFields" hidden>
                <label for="qualification">Qualification</label>
                <input type="text" id="qualification">

                <label for="bod">Date of Birth</label>
                <input type="date" id="bod">

                <label for="age">Age</label>
                <input type="number" id="age" min="1">

                <label for="salary">Salary</label>
                <input type="number" id="salary" min="0" step="0.01">
            </div>

            <div id="studentFields" hidden>
                <label for="studentBod">Date of Birth</label>
                <input type="date" id="studentBod">

                <label for="studentAge">Age</label>
                <input type="number" id="studentAge" min="1">
            </div>

            <button type="submit">Create Account</button>
        </form>
    </div>

    <script src="js/sign in2.js"></script>
</body>

</html>
